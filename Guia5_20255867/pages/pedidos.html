<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de pedidos de una cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/pedidos.css" rel="stylesheet">
    <script src="../js/pedidos.js" defer></script>
</head>
<body>
    <div class="container mt-4">
        <div class="encabezado">
            <p class="subtitulo">MI PEQUEÑA CAFETERÍA</p>
            <h1>NANA☕</h1>
            <p>Gestión de pedidos de una cafetería</p>
        </div>
        <img src="../img/panesitos.png" alt="Café y postres de Dulce Rosa" class="imagen-cafeteria">

        <div class="tarjeta">
            <h3>Registrar pedido</h3>

            <form id="formPedido">
                <div class="mb-3">
                    <label for="producto" class="form-label">Producto</label>
                    <input type="text" class="form-control" id="producto" required>
                </div>

                <div class="mb-3">
                    <label for="precio" class="form-label">Precio unitario</label>
                    <input type="number" class="form-control" id="precio" min="0.01" step="0.01" required>
                </div>

                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" min="1" step="1" required>
                </div>

                <button type="submit" class="btn btn-primary">Agregar pedido</button>
            </form>
        </div>

        <div class="tarjeta">
            <h3>Lista de pedidos</h3>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio unitario</th>
                        <th>Cantidad</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="tablaPedidos"></tbody>
            </table>
            <div class="fila">
                <div class="total">
                    <p>Total de unidades</p>
                    <h2 id="totalUnidades">0</h2>
                </div>

                <div class="total">
                    <p>Monto total</p>
                    <h2>$<span id="montoTotal">0.00</span></h2>
                </div>
            </div>
        </div>
 
        <div>
            <h3>Filtrar productos</h3>
            <p>Buscá tus pedidos por precio máximo.</p>

            <div class="mb-3">
                <label for="precioMaximo" class="form-label">Precio máximo</label>
                <input type="number" class="form-control" id="precioMaximo" min="0" step="0.01">
            </div>
            <div class="botones">
                <button id="btnFiltrar" class="btn btn-success">Filtrar productos</button>
                <button id="btnMostrarTodos" class="btn btn-secondary">Mostrar todos</button>
                <button id="btnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
            </div>
        </div>

        <div class="regresar">
            <a href="../index.html">Regresar</a>
        </div>
    </div>
</body>
</html>
